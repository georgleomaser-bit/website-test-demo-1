<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Click a Button pass icon</title>
<style>
  html, body { margin: 0; padding: 0; background: #07071a; }
  svg { display: block; }
</style>
</head>
<body>
<svg id="art" xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512"></svg>
<script>
  // One 512x512 image per game pass / OP crate; render-passes.mjs loads this page with #<key>.
  // Roblox shows pass images as circles, so everything stays inside the centre circle.
  const ICONS = {
    auto_clicker: { color: "#4de1ff", glyph: "cursor", big: "+5/s", label: "AUTO CLICKER" },
    op_auto_clicker: { color: "#ff3d6e", glyph: "cursor", big: "+15/s", label: "OP AUTO", op: true },
    double_sparks: { color: "#ffd64a", glyph: "bolt", big: "×2", label: "SPARKS" },
    triple_sparks: { color: "#ffa028", glyph: "bolt", big: "×3", label: "SPARKS", op: true },
    double_gems: { color: "#4de1ff", glyph: "gem", big: "×2", label: "GEMS" },
    lucky: { color: "#4ade80", glyph: "clover", big: "+50%", label: "LUCK" },
    super_luck: { color: "#b05cff", glyph: "clover", big: "+150%", label: "SUPER LUCK", op: true },
    fast_crates: { color: "#ffc846", glyph: "crate", big: "×20", label: "FAST CRATES", op: true },
    vip: { color: "#ffc43c", glyph: "crown", big: "VIP", label: "×1.25 ALL" },
    op_crate: { color: "#b05cff", glyph: "crate", big: "EPIC+", label: "OP CRATE", op: true },
    mega_op_crate: { color: "#ffb428", glyph: "crate", big: "LEGEND+", label: "MEGA OP CRATE", op: true },
    ultra_op_crate: { color: "#ff4070", glyph: "crate", big: "MYTHIC+", label: "ULTRA OP CRATE", op: true },
    rainbow_chest: { color: "#ff78dc", glyph: "rainbowCrate", big: "RAINBOW", label: "RAINBOW CHEST", op: true },
  };

  const GLYPHS = {
    bolt: (c) => `<path d="M24 0 L4 36 H18 L12 64 L36 24 H22 Z" transform="translate(206 70) scale(2.6)"
                   fill="${c}" stroke="#2a1600" stroke-width="1.2" stroke-linejoin="round"/>`,
    gem: (c) => `<g transform="translate(196 70) scale(3)">
                   <path d="M20 0 L40 18 L20 52 L0 18 Z" fill="${c}" stroke="#063848" stroke-width="1"/>
                   <path d="M0 18 H40 M12 18 L20 0 L28 18 L20 52" fill="none" stroke="#fff" stroke-opacity="0.6" stroke-width="1.2"/>
                 </g>`,
    cursor: (c) => `<g transform="translate(212 64) scale(1.25)">
                   <path d="M0 0 L0 118 L28 92 L46 134 L66 125 L48 85 L86 85 Z" fill="#ffffff"
                         stroke="${c}" stroke-width="8" stroke-linejoin="round"/>
                 </g>`,
    clover: (c) => `<g transform="translate(256 150)" fill="${c}" stroke="#08361b" stroke-width="3">
                   <circle cx="-34" cy="-34" r="38"/><circle cx="34" cy="-34" r="38"/>
                   <circle cx="-34" cy="34" r="38"/><circle cx="34" cy="34" r="38"/>
                   <path d="M0 40 Q8 80 30 100" fill="none" stroke="${c}" stroke-width="12" stroke-linecap="round"/>
                 </g>`,
    crown: (c) => `<g transform="translate(146 74) scale(2.2)">
                   <path d="M0 60 L10 10 L35 40 L50 0 L65 40 L90 10 L100 60 Z" fill="${c}" stroke="#3a2600" stroke-width="2" stroke-linejoin="round"/>
                   <rect x="0" y="62" width="100" height="14" rx="3" fill="${c}" stroke="#3a2600" stroke-width="2"/>
                   <circle cx="50" cy="0" r="6" fill="#fff"/><circle cx="10" cy="10" r="5" fill="#fff"/><circle cx="90" cy="10" r="5" fill="#fff"/>
                 </g>`,
    crate: (c) => `<g transform="translate(166 70)">
                   <ellipse cx="90" cy="40" rx="110" ry="40" fill="${c}" opacity="0.45" filter="url(#blur)"/>
                   <path d="M0 60 L180 60 L180 170 L0 170 Z" fill="${c}" stroke="#2a1600" stroke-width="5"/>
                   <path d="M0 60 L24 36 L204 36 L180 60 Z" fill="#fff4c4" stroke="#2a1600" stroke-width="5"/>
                   <path d="M180 60 L204 36 L204 146 L180 170 Z" fill="#000" fill-opacity="0.35" stroke="#2a1600" stroke-width="5"/>
                   <path d="M0 100 H180 M0 136 H180 M78 60 V170 M102 60 V170" stroke="#000" stroke-opacity="0.3" stroke-width="7"/>
                 </g>`,
  };

  // The Rainbow Chest: the crate painted with the rainbow gradient defined below.
  GLYPHS.rainbowCrate = () => GLYPHS.crate("url(#rainbow)");

  const key = decodeURIComponent(location.hash.slice(1)) || "auto_clicker";
  const icon = ICONS[key];
  const bigSize = icon.big.length > 5 ? 84 : icon.big.length > 3 ? 104 : 128;
  document.getElementById("art").innerHTML = `
    <defs>
      <radialGradient id="bg" cx="50%" cy="42%" r="70%">
        <stop offset="0" stop-color="${icon.color}" stop-opacity="0.45"/>
        <stop offset="0.5" stop-color="#160a2c"/>
        <stop offset="1" stop-color="#07071a"/>
      </radialGradient>
      <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="16"/></filter>
      <linearGradient id="rainbow" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#ff5078"/><stop offset="0.25" stop-color="#ffd250"/>
        <stop offset="0.5" stop-color="#50ffaa"/><stop offset="0.75" stop-color="#50aaff"/>
        <stop offset="1" stop-color="#dc64ff"/>
      </linearGradient>
      <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
        <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.7"/>
      </filter>
    </defs>
    <rect width="512" height="512" fill="url(#bg)"/>
    <circle cx="256" cy="256" r="232" fill="none" stroke="${icon.color}" stroke-width="14" opacity="0.5" filter="url(#blur)"/>
    <circle cx="256" cy="256" r="232" fill="none" stroke="${icon.color}" stroke-width="6"/>
    <g filter="url(#shadow)">${GLYPHS[icon.glyph](icon.color)}</g>
    <text x="256" y="384" text-anchor="middle" font-family="Inter Display, Inter, sans-serif" font-weight="900"
          font-size="${bigSize}" fill="#ffffff" stroke="${icon.color}" stroke-width="3" paint-order="stroke"
          filter="url(#shadow)">${icon.big}</text>
    <text x="256" y="440" text-anchor="middle" font-family="Inter, sans-serif" font-weight="800"
          font-size="${icon.label.length > 12 ? 30 : 36}" letter-spacing="1" fill="${icon.color}"
          filter="url(#shadow)">${icon.label}</text>
    ${icon.op ? `<g filter="url(#shadow)">
      <rect x="206" y="28" width="100" height="44" rx="22" fill="#ff3d6e" stroke="#fff" stroke-width="3"/>
      <text x="256" y="61" text-anchor="middle" font-family="Inter Display, Inter, sans-serif" font-weight="900"
            font-size="30" fill="#fff">OP</text></g>` : ""}
  `;
</script>
</body>
</html>
