<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Click a Button icon</title>
<style>
  html, body { margin: 0; padding: 0; background: #09091a; }
  svg { display: block; }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="46%" r="72%">
      <stop offset="0" stop-color="#3a0f3c"/>
      <stop offset="0.45" stop-color="#1a0b2c"/>
      <stop offset="1" stop-color="#07071a"/>
    </radialGradient>
    <radialGradient id="cap" cx="38%" cy="30%" r="78%">
      <stop offset="0" stop-color="#ffb3c6"/>
      <stop offset="0.28" stop-color="#ff5c86"/>
      <stop offset="0.7" stop-color="#ff3d6e"/>
      <stop offset="1" stop-color="#b8124a"/>
    </radialGradient>
    <linearGradient id="skirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c41c58"/>
      <stop offset="1" stop-color="#6e0c34"/>
    </linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1f3f"/>
      <stop offset="1" stop-color="#120d1f"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff2a8"/>
      <stop offset="1" stop-color="#ffb627"/>
    </linearGradient>
    <linearGradient id="gem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9f6ff"/>
      <stop offset="1" stop-color="#25b9e6"/>
    </linearGradient>
    <filter id="blur18" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="blur6" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <filter id="textShadow" x="-20%" y="-40%" width="140%" height="180%">
      <feDropShadow dx="0" dy="4" stdDeviation="2" flood-color="#5a0626" flood-opacity="0.9"/>
    </filter>
    <symbol id="boltShape" viewBox="0 0 40 64">
      <path d="M24 0 L4 36 H18 L12 64 L36 24 H22 Z"/>
    </symbol>
  </defs>

  <!-- Background with soft light rays -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <g opacity="0.16" fill="#ff3d6e">
    <path d="M256 236 L196 -20 L316 -20 Z"/>
    <path d="M256 236 L532 96 L532 236 Z"/>
    <path d="M256 236 L532 396 L460 532 Z"/>
    <path d="M256 236 L52 532 L-20 396 Z"/>
    <path d="M256 236 L-20 236 L-20 96 Z"/>
  </g>
  <g opacity="0.12" fill="#b05cff">
    <path d="M256 236 L420 -20 L532 -20 L532 20 Z"/>
    <path d="M256 236 L330 532 L190 532 Z"/>
    <path d="M256 236 L-20 -20 L92 -20 Z"/>
  </g>

  <!-- Shockwave rings -->
  <circle cx="256" cy="262" r="232" fill="none" stroke="#ff3d6e" stroke-width="3" opacity="0.35"/>
  <circle cx="256" cy="262" r="214" fill="none" stroke="#4de1ff" stroke-width="2" opacity="0.3"/>

  <!-- Outer glow -->
  <circle cx="256" cy="262" r="190" fill="#ff3d6e" opacity="0.55" filter="url(#blur18)"/>

  <!-- Button: base, skirt (depth), cap -->
  <g filter="url(#shadow)">
    <circle cx="256" cy="268" r="196" fill="url(#base)" stroke="#4a3466" stroke-width="5"/>
  </g>
  <circle cx="256" cy="282" r="170" fill="url(#skirt)"/>
  <circle cx="256" cy="256" r="164" fill="url(#cap)" stroke="#ff9ab6" stroke-width="6"/>
  <ellipse cx="256" cy="168" rx="112" ry="56" fill="url(#gloss)"/>

  <!-- Label -->
  <text x="256" y="286" text-anchor="middle" font-family="Inter Display, Inter, sans-serif" font-weight="900"
        font-size="84" letter-spacing="1" fill="#ffffff" filter="url(#textShadow)">CLICK</text>

  <!-- Sparks and gems -->
  <g fill="url(#bolt)" stroke="#7a4a00" stroke-width="1.5">
    <use href="#boltShape" x="40" y="44" width="46" height="74"/>
    <use href="#boltShape" x="430" y="70" width="34" height="54"/>
    <use href="#boltShape" x="58" y="388" width="30" height="48"/>
  </g>
  <g stroke="#0b5f7a" stroke-width="1.5">
    <path d="M452 352 l20 22 l-20 30 l-20 -30 Z" fill="url(#gem)"/>
    <path d="M92 214 l12 13 l-12 18 l-12 -18 Z" fill="url(#gem)"/>
  </g>
  <g fill="#ffffff">
    <circle cx="120" cy="96" r="3"/>
    <circle cx="398" cy="150" r="2.5"/>
    <circle cx="430" cy="460" r="3"/>
    <circle cx="150" cy="470" r="2"/>
  </g>

  <!-- Cursor pressing the button -->
  <g stroke="#ffd34d" stroke-width="7" stroke-linecap="round">
    <line x1="326" y1="312" x2="326" y2="298"/>
    <line x1="304" y1="324" x2="290" y2="318"/>
    <line x1="344" y1="314" x2="352" y2="302"/>
  </g>
  <g transform="translate(330 334) rotate(-14)">
    <path d="M0 0 L0 118 L28 92 L46 134 L66 125 L48 85 L86 85 Z"
          fill="#ffffff" stroke="#14101f" stroke-width="9" stroke-linejoin="round" filter="url(#shadow)"/>
  </g>
</svg>
</body>
</html>
