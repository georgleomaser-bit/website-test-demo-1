<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://api.open-meteo.com https://geocoding-api.open-meteo.com; worker-src 'self'; manifest-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <title>NOVA – Dein KI-Assistent</title>
  <meta name="description" content="NOVA – der KI-Assistent zum Sprechen: beantwortet alles, sucht im Netz, versteht Fotos und PDFs, sagt das Wetter, stellt Timer und macht dir einen Sparplan." />
  <meta name="theme-color" content="#04030d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="NOVA" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta property="og:title" content="NOVA – Dein KI-Assistent, der mit dir spricht" />
  <meta property="og:description" content="Frag einfach. NOVA antwortet – mit Stimme, Websuche, Fotos und PDFs." />
  <link rel="stylesheet" href="css/nova.css" />
</head>
<body data-state="idle">
  <canvas id="space" aria-hidden="true"></canvas>
  <div class="nebula" aria-hidden="true"><i></i><i></i><i></i></div>

  <header class="top">
    <div class="top-l"><button class="glass icon" id="chats-btn" type="button" aria-label="Chats">☰</button><div class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="6.5" /><ellipse cx="16" cy="16" rx="14" ry="5" transform="rotate(-24 16 16)" /></svg><b id="brand-name">NOVA</b></div></div>
    <div class="top-r"><button class="glass icon" id="new-btn" type="button" aria-label="Neuer Chat" title="Neuer Chat">✎</button><button class="glass chip" id="plan-chip" type="button">…</button><button class="glass icon" id="settings-btn" type="button" aria-label="Einstellungen">⚙︎</button></div>
  </header>

  <main class="stage">
    <div class="orb-wrap" id="orb-wrap" role="button" tabindex="0" aria-label="Mit NOVA sprechen">
      <div class="halo" aria-hidden="true"></div>
      <canvas id="orb" aria-hidden="true"></canvas>
    </div>
    <p class="state" id="state" aria-live="polite"></p>
    <p class="caption" id="caption" aria-live="polite"></p>

    <section class="log" id="log" aria-live="polite">
      <div class="hello" id="hello">
        <h1>Frag mich <em>alles</em>.</h1>
        <p>Schreiben, erklären, programmieren, recherchieren, Ideen spinnen – per Text oder Stimme. Ich lese auch Fotos und PDFs.</p>
      </div>
    </section>
  </main>

  <footer class="dock">
    <div class="chips" id="chips">
      <button class="glass" data-ask="Hilf mir, eine freundliche Nachricht an meinen Chef zu schreiben: Ich bin morgen krank.">✍️ Text schreiben</button>
      <button class="glass" data-ask="Erklär mir, wie Schwarze Löcher entstehen – so, dass ich es wirklich verstehe.">🪐 Erklär mir …</button>
      <button class="glass" data-ask="Schreib mir ein kleines Python-Programm, das ein Würfelspiel simuliert, und erklär es kurz.">💻 Code-Hilfe</button>
      <button class="glass" data-ask="Gib mir 5 kreative Geschäftsideen, die man mit wenig Geld starten kann.">💡 Idee entwickeln</button>
      <button class="glass" data-ask="Was sind heute die wichtigsten Nachrichten?">📰 Nachrichten</button>
      <button class="glass" data-ask="Wie ist das Wetter heute?">☀️ Wetter</button>
      <button class="glass" data-ask="Erinnere mich in 10 Minuten an die Pause">⏰ Erinnerung</button>
    </div>
    <div class="attach-prev" id="attach-prev" hidden></div>
    <form class="composer glass" id="composer" autocomplete="off">
      <label class="clip" title="Foto oder PDF anhängen" aria-label="Foto oder PDF anhängen"><input type="file" id="photo" accept="image/*,application/pdf" hidden />＋</label>
      <input id="input" type="text" enterkeyhint="send" placeholder="Frag NOVA …" aria-label="Nachricht an NOVA" maxlength="4000" />
      <button class="send" type="submit" aria-label="Senden oder stoppen"><span class="s-go">➤</span><span class="s-stop">■</span></button>
      <button class="mic" id="mic" type="button" aria-label="Sprechen"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3" /><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21" /></svg></button>
    </form>
  </footer>

  <div class="sheet side" id="sheet-chats" hidden>
    <div class="sheet-box glass" role="dialog" aria-label="Chats">
      <div class="sheet-h"><h3>Chats</h3><button class="icon" data-close aria-label="Schließen">✕</button></div>
      <div class="sheet-b" id="chats-body"></div>
    </div>
  </div>
  <div class="sheet" id="sheet-settings" hidden>
    <div class="sheet-box glass" role="dialog" aria-label="Einstellungen">
      <div class="sheet-h"><h3>Einstellungen</h3><button class="icon" data-close aria-label="Schließen">✕</button></div>
      <div class="sheet-b" id="settings-body"></div>
    </div>
  </div>
  <div class="sheet" id="sheet-plans" hidden>
    <div class="sheet-box glass" role="dialog" aria-label="Tarife">
      <div class="sheet-h"><h3>Mehr NOVA</h3><button class="icon" data-close aria-label="Schließen">✕</button></div>
      <div class="sheet-b plans" id="plans-body"></div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
